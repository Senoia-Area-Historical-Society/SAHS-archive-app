<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Every page needs Firestore and Storage. Warming the connections here saves
      a DNS + TLS round trip on the critical path, since the app can't request
      any content until the JS bundle has parsed and initialized Firebase.
    -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://storage.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.weserv.nl" />

    <!-- site-head:start -->
    <!--
      Defaults only. Public routes override title/description/canonical at runtime
      (see src/lib/seo.ts). A deployment can replace everything between the
      site-head markers with its own copy: see siteHead in vite.config.ts.
    -->
    <!--
      No icon by default: a museum's icon is its own logo, so it comes with its head
      file (and its files, SITE_PUBLIC_DIR in vite.config.ts).
    -->
    <meta name="theme-color" content="#3a2d1d" />
    <title>Digital Archive</title>
    <meta
      name="description"
      content="Explore this digital archive of photographs, documents, oral histories, and artifacts."
    />
    <!--
      No static rel=canonical here on purpose. index.html is the shell for every
      route, so a hardcoded canonical would declare every item page to be a
      duplicate of the homepage. Canonicals are set per-route in src/lib/seo.ts.
    -->
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Digital Archive" />
    <meta property="og:title" content="Digital Archive" />
    <meta
      property="og:description"
      content="Explore this digital archive of photographs, documents, oral histories, and artifacts."
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Digital Archive" />
    <meta
      name="twitter:description"
      content="Explore this digital archive of photographs, documents, oral histories, and artifacts."
    />
    <!-- site-head:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
