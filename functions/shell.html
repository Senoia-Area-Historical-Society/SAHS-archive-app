<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Every page needs Firestore and Storage. Warming the connections here saves
      a DNS + TLS round trip on the critical path, since the app can't request
      any content until the JS bundle has parsed and initialized Firebase.
    -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://storage.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.weserv.nl" />

    <!-- logo2.png is 2000x2000 and 105 KB; these are sized for their actual use. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#3a2d1d" />

    <!--
      Defaults only. Public routes override title/description/canonical at runtime
      (see src/lib/seo.ts). Crawlers that do not execute JavaScript fall back to these.
    -->
    <title>Senoia Area Historical Society | Digital Archive</title>
    <meta
      name="description"
      content="Explore the Senoia Area Historical Society's digital archive: photographs, documents, oral histories, and artifacts documenting the history of Senoia and Coweta County, Georgia."
    />
    <!--
      No static rel=canonical here on purpose. index.html is the shell for every
      route, so a hardcoded canonical would declare all ~1,500 item pages to be
      duplicates of the homepage. Canonicals are set per-route in src/lib/seo.ts.
    -->
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Senoia Area Historical Society Digital Archive" />
    <meta property="og:title" content="Senoia Area Historical Society | Digital Archive" />
    <meta
      property="og:description"
      content="Explore the Senoia Area Historical Society's digital archive: photographs, documents, oral histories, and artifacts documenting the history of Senoia and Coweta County, Georgia."
    />
    <!-- og:url is likewise omitted: scrapers fall back to the requested URL,
         whereas a hardcoded value would collapse every shared item into one entity. -->
    <meta property="og:image" content="https://archives.senoiahistory.com/home-street-view.jpg" />
    <meta property="og:image:width" content="960" />
    <meta property="og:image:height" content="602" />
    <meta property="og:image:alt" content="Historic street view of Senoia, Georgia" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Senoia Area Historical Society | Digital Archive" />
    <meta
      name="twitter:description"
      content="Explore the Senoia Area Historical Society's digital archive: photographs, documents, oral histories, and artifacts documenting the history of Senoia and Coweta County, Georgia."
    />
    <meta name="twitter:image" content="https://archives.senoiahistory.com/home-street-view.jpg" />

    <!--
      Sitewide organization entity. Kept static rather than injected at runtime
      so crawlers that don't execute JavaScript still see it. Per-page entities
      (items, collections, books, breadcrumbs) are added by useJsonLd.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Museum",
        "name": "Senoia Area Historical Society",
        "url": "https://archives.senoiahistory.com",
        "logo": "https://archives.senoiahistory.com/logo2.png",
        "description": "The Senoia Area Historical Society preserves and shares the history of Senoia and Coweta County, Georgia through a digital archive of photographs, documents, artifacts and oral histories.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Senoia",
          "addressRegion": "GA",
          "addressCountry": "US"
        }
      }
    </script>
    <script type="module" crossorigin src="/assets/index-DkUNQ2tV.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/react-vendor-ozGIukTL.js">
    <link rel="modulepreload" crossorigin href="/assets/firebase-core-DIcWL_y_.js">
    <link rel="modulepreload" crossorigin href="/assets/firebase-storage-B9TWWJMM.js">
    <link rel="modulepreload" crossorigin href="/assets/firebase-extras-63Ab1wbK.js">
    <link rel="modulepreload" crossorigin href="/assets/lucide-DDPN1F3U.js">
    <link rel="stylesheet" crossorigin href="/assets/index-DhcfW-tS.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
